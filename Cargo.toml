[package]
name = "amoled-kurokku-esp"
version = "0.1.0"
authors = ["swilcox"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

# build.rs rasterizes fonts with fontdue; unoptimized, that takes a while.
[profile.dev.build-override]
opt-level = 3
[profile.release.build-override]
opt-level = 3

[dependencies]
log = { version = "0.4", default-features = false }
anyhow = "1"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# ESP-IDF bindings — only needed for the firmware target. Keeping this
# target-gated lets `cargo test --target <host>` build pure modules without
# an ESP toolchain.
[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "0.53"

# Host-only: the `preview` example writes rendered faces to PNG.
[target.'cfg(not(target_os = "espidf"))'.dev-dependencies]
png = "0.18"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
# Rasterizes assets/fonts/*.ttf into glyph atlases at build time.
fontdue = "0.9"
